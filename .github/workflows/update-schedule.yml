name: update-schedule

on:
  schedule:
    # 10:20 and 22:20 KST. GitHub cron is UTC.
    - cron: '20 1,13 * * *'
  workflow_dispatch:
    inputs:
      season:
        description: '시즌 — sync 일정 갱신(잔여 경기 없으면 자동 종료) / end 지금 시즌 종료'
        type: choice
        options:
          - sync
          - 'end'
        default: sync
      dry_run:
        description: '커밋하지 않고 로그만'
        type: boolean
        default: false

permissions:
  contents: write
  # Season end disables sms-reminder/update-schedule and enables season-scheduler.
  actions: write

concurrency:
  group: update-schedule
  cancel-in-progress: false

jobs:
  sync:
    name: sync remaining games
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Fetch KBO schedule
        run: node scripts/sync-games.test.mjs && node scripts/sync-games.mjs
      - name: Reconcile SMS scheduler with remaining games
        id: scheduler
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '0' }}
        run: node scripts/sms-scheduler-toggle.mjs --auto-remaining
      - name: Detect season end
        id: season
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '0' }}
          SEASON_INPUT: ${{ github.event.inputs.season || 'sync' }}
        run: |
          if [ "$SEASON_INPUT" = 'end' ]; then
            node scripts/season-scheduler.mjs end
          else
            node scripts/season-scheduler.mjs --auto
          fi
      - name: Commit schedule
        id: commit
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '0' }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add client/src/data/games.json client/src/data/tbd.json client/src/data/schedule-meta.json client/src/data/season.json
          if git diff --staged --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo '일정 변경 없음' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo '### 잔여 경기 일정 갱신'
            echo
            git diff --staged --stat
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$DRY_RUN" = '1' ]; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'dry-run: 커밋하지 않습니다.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          npm ci
          npm run pages:sync
          git add index.html 404.html favicon.svg .nojekyll assets
          git commit -m "chore: sync remaining KIA schedule"
          git push
          echo 'changed=true' >> "$GITHUB_OUTPUT"
      - name: Commit SMS scheduler auto state
        if: ${{ steps.scheduler.outputs.changed == 'true' }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          npm ci
          npm run pages:sync
          git add sms.config.json index.html 404.html favicon.svg .nojekyll assets
          git commit -m "chore: SMS scheduler ${{ steps.scheduler.outputs.action }}"
          git push
          {
            echo "### 문자 스케줄러 ${{ steps.scheduler.outputs.action }}"
            echo "잔여 서울 원정 ${{ steps.scheduler.outputs.remaining }}경기 기준으로 스케줄러와 홈페이지 ON/OFF를 맞췄습니다."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Stop season workflows
        # Season over: hand off to the season-scheduler watcher until next season.
        if: ${{ steps.season.outputs.status == 'ended' }}
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '0' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/season-scheduler.mjs --apply-workflows
          {
            echo '### 시즌 종료'
            echo 'sms-reminder·update-schedule 스케줄을 멈췄습니다. 비시즌에는 워크플로가 돌지 않고, season-scheduler가 3월 1일부터 다음 시즌 일정을 확인해 다시 시작합니다.'
          } >> "$GITHUB_STEP_SUMMARY"
