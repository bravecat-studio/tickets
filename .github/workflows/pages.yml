name: github-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test -w client
      - run: node scripts/sms-reminder.mjs --self-test
      - run: npm run typecheck -w client
      - run: npm run build -w client
        env:
          BASE_PATH: /tickets/
      - run: cp client/dist/index.html client/dist/404.html
      # Branch-source Pages publishes README unless the built SPA is at repo root.
      - run: node scripts/sync-pages-fallback.mjs
      - name: Commit Pages fallback if drifted
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html 404.html favicon.svg .nojekyll assets
          if git diff --staged --quiet; then
            echo 'Pages fallback already current'
            exit 0
          fi
          git commit -m "chore: sync GitHub Pages fallback"
          git push
      - run: node scripts/sync-pages-fallback.mjs --check
      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
