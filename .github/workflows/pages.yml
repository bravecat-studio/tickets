name: github-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test -w client
      - run: node scripts/sms-reminder.mjs --self-test
      - run: npm run typecheck -w client
      - run: npm run build -w client
        env:
          BASE_PATH: /tickets/
      - run: cp client/dist/index.html client/dist/404.html
      # Branch-source Pages publishes README unless the built SPA is at repo root.
      - run: node scripts/sync-pages-fallback.mjs --check
      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
